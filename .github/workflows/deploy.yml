name: Deploy site to GitHub Pages

# Builds site/ with Vite and publishes site/dist/ to GitHub Pages on every push
# to main. Requires: repo Settings → Pages → Source = "GitHub Actions", and a
# public repo (or a plan that allows Pages on private repos).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time. Not cancel-in-progress: GitHub's guidance for Pages —
# cancelling mid-deploy can leave the Pages deployment wedged rather than superseded.
# A newer push just queues behind the running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Prerendering is the whole point of the build: refuse to publish if any of the
      # seven expected documents is missing (a silently-empty prerender would otherwise
      # deploy "successfully").
      - name: Verify prerendered pages
        run: |
          for f in index about events candy-canes info join 404; do
            test -f "dist/$f.html" || { echo "missing dist/$f.html" >&2; exit 1; }
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
