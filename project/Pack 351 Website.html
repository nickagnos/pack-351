<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pack 351 · Cub Scouts · Lindale, TX</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:       #1b3068;
  --navy-dark:  #0f1e40;
  --navy-light: #edf0f9;
  --gold:       #d4950a;
  --gold-dark:  #a87308;
  --gold-light: #fef3c7;
  --cream:      #faf7f0;
  --text:       #1a1a2e;
  --muted:      #64748b;
  --border:     #e2ddd4;
  --rad:        8px;
}
html { scroll-behavior: smooth; }
body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}
h1, h2, h3, h4 {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 700;
  line-height: 1.05;
  text-wrap: balance;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
p { text-wrap: pretty; }
input, select, textarea { font-family: 'Nunito', sans-serif; }

.container { max-width: 1160px; margin: 0 auto; padding: 0 24px; }
.section    { padding: 72px 0; }
.section-sm { padding: 48px 0; }

.eyebrow {
  font-family: 'Nunito', sans-serif;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gold);
  display: block;
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 11px 22px; border-radius: var(--rad);
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 18px; letter-spacing: .5px;
  transition: all .14s ease;
  cursor: pointer; border: 2px solid transparent;
  white-space: nowrap; line-height: 1;
}
.btn-primary { background: var(--gold); color: var(--navy-dark); border-color: var(--gold); }
.btn-primary:hover { background: var(--gold-dark); border-color: var(--gold-dark); }
.btn-navy { background: var(--navy); color: #fff; border-color: var(--navy); }
.btn-navy:hover { background: var(--navy-dark); }
.btn-ghost { background: transparent; color: var(--navy); border-color: var(--navy); }
.btn-ghost:hover { background: var(--navy-light); }
.btn-ghost-white { background: transparent; color: #fff; border-color: rgba(255,255,255,.5); }
.btn-ghost-white:hover { background: rgba(255,255,255,.08); border-color: #fff; }
.btn-lg { padding: 14px 30px; font-size: 21px; }
.btn-sm { padding: 7px 14px; font-size: 15px; border-width: 1.5px; }

/* Card */
.card {
  background: #fff;
  border-radius: var(--rad);
  border: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.07);
}

/* Photo slot */
.ps {
  position: relative; overflow: hidden;
  background-image: repeating-linear-gradient(135deg, transparent 0 22px, rgba(0,0,0,.045) 22px 23px);
}
.ps-indicator {
  position: absolute; top: 10px; left: 10px;
  font-family: monospace; font-size: 11px; color: rgba(0,0,0,.32);
  background: rgba(255,255,255,.72); padding: 3px 8px; border-radius: 3px;
  pointer-events: none;
}
.ps-caption {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.56));
  padding: 32px 16px 14px;
}
.ps-caption-text {
  font-family: 'Barlow Condensed', sans-serif; font-weight: 700;
  font-size: 20px; color: #fff; letter-spacing: .3px;
}

/* Responsive */
@media (max-width: 820px) {
  .nav-desktop-links { display: none !important; }
  .nav-hamburger-btn { display: flex !important; }
  .footer-grid { grid-template-columns: 1fr 1fr !important; }
  .home-grid { grid-template-columns: 1fr 1fr !important; grid-template-rows: auto !important; }
  .home-grid .ps-span2r { grid-row: span 1 !important; }
  .home-grid .ps-span2c { grid-column: span 2 !important; }
  .facts-grid { grid-template-columns: repeat(2, 1fr) !important; }
}
@media (max-width: 600px) {
  .container { padding: 0 16px; }
  .section { padding: 48px 0; }
  .home-grid { grid-template-columns: 1fr !important; }
  .home-grid .ps-span2c { grid-column: span 1 !important; }
  .den-grid { grid-template-columns: repeat(3, 1fr) !important; }
  .leaders-grid { grid-template-columns: 1fr 1fr !important; }
  .events-featured-grid { grid-template-columns: 1fr !important; }
  .join-grid { grid-template-columns: 1fr !important; }
  .footer-grid { grid-template-columns: 1fr !important; }
  .facts-grid { grid-template-columns: 1fr 1fr !important; }
}
</style>
</head>
<body>
<div id="root"></div>

</html>
