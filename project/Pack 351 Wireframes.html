<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pack 351 · Wireframes</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&family=Kalam:wght@400;700&family=Gloria+Hallelujah&display=swap" rel="stylesheet" />

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f3efe6;
    font-family: 'Patrick Hand', system-ui, sans-serif;
    color: #1a1a1a;
  }
  * { box-sizing: border-box; }

  /* ── wireframe primitives ── */
  .wf {
    --ink: #1a1a1a;
    --paper: #fdfaf2;
    --muted: #888;
    --accent: var(--wf-accent, #2b5d3a);
    --line: 1.75px;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Patrick Hand', system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.3;
    border: var(--line) solid var(--ink);
    border-radius: 3px;
    position: relative;
    overflow: hidden;
  }
  .wf-hand { font-family: 'Caveat', cursive; font-weight: 700; }
  .wf-scribble { font-family: 'Gloria Hallelujah', cursive; }

  .wf-box {
    border: var(--line) solid var(--ink);
    border-radius: 4px;
    background: var(--paper);
  }
  .wf-dashed {
    border: var(--line) dashed var(--ink);
    border-radius: 4px;
  }
  .wf-photo {
    border: var(--line) dashed var(--ink);
    background:
      repeating-linear-gradient(135deg, transparent 0 14px, rgba(0,0,0,.06) 14px 15px);
    color: var(--ink);
    font-family: 'Caveat', cursive;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    position: relative;
  }
  .wf-photo::before, .wf-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    border: 1.5px dashed transparent;
  }
  .wf-photo .cross {
    position: absolute;
    inset: 6px;
    pointer-events: none;
    opacity: .25;
  }
  .wf-photo .cross::before, .wf-photo .cross::after {
    content: '';
    position: absolute;
    inset: 0;
    border-top: 1.5px solid var(--ink);
    transform-origin: 0 0;
  }
  .wf-photo .cross::before { transform: rotate(0deg) translateY(0); top: 0; }
  .wf-photo .cross::after { transform: rotate(0deg); top: 100%; }
  .wf-photo .label {
    background: var(--paper);
    padding: 2px 10px;
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    font-size: 18px;
    z-index: 2;
    transform: rotate(-1.5deg);
  }

  .wf-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: var(--line) solid var(--ink);
    background: var(--paper);
    padding: 8px 18px;
    border-radius: 4px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 22px;
    box-shadow: 3px 3px 0 var(--ink);
    cursor: pointer;
  }
  .wf-btn.primary {
    background: var(--accent);
    color: #fff;
  }
  .wf-btn.ghost {
    box-shadow: none;
    background: transparent;
  }
  .wf-pill {
    display: inline-block;
    border: var(--line) solid var(--ink);
    border-radius: 999px;
    padding: 3px 12px;
    font-size: 15px;
    background: var(--paper);
  }
  .wf-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 14px;
    background: var(--paper);
  }

  .wf-h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 56px; line-height: 1; margin: 0; }
  .wf-h2 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 38px; line-height: 1; margin: 0; }
  .wf-h3 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; line-height: 1.1; margin: 0; }
  .wf-eyebrow {
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 14px;
    letter-spacing: .5px;
    color: var(--muted);
  }

  /* underline squiggle */
  .wf-squig {
    text-decoration: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 6'><path d='M0 3 Q5 0 10 3 T20 3 T30 3 T40 3' fill='none' stroke='%231a1a1a' stroke-width='1.5'/></svg>");
    background-repeat: repeat-x;
    background-position: 0 100%;
    background-size: 40px 6px;
    padding-bottom: 6px;
  }

  /* lined text placeholder */
  .wf-lines {
    background:
      repeating-linear-gradient(to bottom,
        transparent 0 10px,
        rgba(0,0,0,.35) 10px 11px,
        transparent 11px 22px);
    height: 100%;
  }
  .wf-line {
    height: 1.5px;
    background: rgba(0,0,0,.7);
    border-radius: 2px;
    margin: 7px 0;
  }
  .wf-line.short { width: 60%; }
  .wf-line.mid { width: 80%; }

  /* stamps / sticky notes */
  .wf-note {
    background: #ffe98a;
    border: 1.5px solid var(--ink);
    padding: 8px 12px;
    font-family: 'Gloria Hallelujah', cursive;
    font-size: 15px;
    box-shadow: 3px 3px 0 rgba(0,0,0,.4);
    transform: rotate(-1.5deg);
  }
  .wf-stamp {
    border: 2px dashed #b03a2e;
    color: #b03a2e;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 22px;
    padding: 4px 10px;
    transform: rotate(-6deg);
    display: inline-block;
  }
  .wf-accent { color: var(--accent); }
  .wf-accent-bg { background: var(--accent); color: #fff; }

  /* nav */
  .wf-nav {
    display: flex;
    gap: 18px;
    align-items: center;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 22px;
  }
  .wf-nav a { cursor: pointer; }
  .wf-logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: 26px;
  }
  .wf-logo .badge {
    width: 36px;
    height: 36px;
    border: var(--line) solid var(--ink);
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    transform: rotate(-5deg);
  }

  /* phone frame */
  .wf-phone {
    border: 6px solid var(--ink);
    border-radius: 26px;
    background: var(--paper);
    overflow: hidden;
    position: relative;
  }
  .wf-phone-notch {
    position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
    width: 80px; height: 14px; background: var(--ink); border-radius: 8px;
  }

  /* helpers */
  .row { display: flex; }
  .col { display: flex; flex-direction: column; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; }
  .gap-12 { gap: 12px; } .gap-16 { gap: 16px; } .gap-20 { gap: 20px; }
  .gap-24 { gap: 24px; } .gap-32 { gap: 32px; }
  .flex-1 { flex: 1; }
  .center { display: flex; align-items: center; justify-content: center; }
  .p-12 { padding: 12px; } .p-16 { padding: 16px; } .p-20 { padding: 20px; }
  .p-24 { padding: 24px; } .p-32 { padding: 32px; }

  /* canvas backdrop tweaks */
  body { background: #ebe5d7; }

  /* hand-drawn arrow */
  .wf-arrow {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    color: var(--accent);
  }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</body>
