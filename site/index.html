<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pack 351 · Cub Scouts · Lindale, TX</title>
    <meta name="description" content="Cub Scout Pack 351 in Lindale, TX — building friendships, skills, and memories for K–5th graders." />

    <!-- Vite rewrites this href for the /pack-351/ base at build time. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link previews. The Pack's main channel is a Facebook group, so a shared link
         renders as a card there; without these it shows as a bare URL. og:url and
         og:image must be absolute, so they hardcode the production origin — update
         both if the site ever moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Cub Scout Pack 351" />
    <meta property="og:title" content="Pack 351 · Cub Scouts · Lindale, TX" />
    <meta property="og:description" content="Cub Scouts for K–5th graders in Lindale, TX. Campouts, the Pinewood Derby, the Raingutter Regatta — and a welcome for every family. Drop in to a Tuesday meeting." />
    <meta property="og:url" content="https://nickagnos.github.io/pack-351/" />
    <meta property="og:image" content="https://nickagnos.github.io/pack-351/scroll-world/trail.jpg" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="832" />
    <meta property="og:image:alt" content="Cub Scouts hiking up a pine trail" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
