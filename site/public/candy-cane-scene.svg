<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000"
     role="img" aria-label="A house on a winter night with large candy canes planted along the front lawn">
  <!--
    Original artwork for the Hideaway candy cane fundraiser - drawn here, not photographed.
    It exists because the thing this page is actually about (five-foot candy canes planted in
    yards) appears in no stock Scouting America photograph, so the old hero was a generic
    door-to-door shot that showed none of it.

    Referenced from plain <img src>, which is why every style is inline and there is no script:
    an SVG in an <img> runs its own CSS animations but loads no external resources and executes
    no JS. Same file serves the page hero (16:10), the Events card and the About column; the
    house and the middle three canes sit inside the centre 60% so an object-fit: cover crop in
    any of those boxes still frames the subject.
  -->
  <style>
    .snow-layer { animation: fall linear infinite; }
    .s1 { animation-duration: 14s; }
    .s2 { animation-duration: 22s; }
    .s3 { animation-duration: 32s; }
    @keyframes fall { from { transform: translateY(0); } to { transform: translateY(1000px); } }

    .twinkle { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .star { animation: shimmer 4s ease-in-out infinite; }
    @keyframes shimmer { 0%, 100% { opacity: .85; } 50% { opacity: .25; } }

    .smoke { animation: rise 7s ease-out infinite; }
    @keyframes rise {
      0%   { transform: translate(0, 0) scale(1);   opacity: .5; }
      100% { transform: translate(38px, -170px) scale(2.4); opacity: 0; }
    }

    /* The whole point of this scene is the candy canes, not the motion. Anyone who has asked
       their OS for less of it gets the still illustration, which loses nothing. */
    @media (prefers-reduced-motion: reduce) {
      .snow-layer, .twinkle, .star, .smoke { animation: none; }
      .smoke { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1733"/>
      <stop offset="55%"  stop-color="#1b3068"/>
      <stop offset="100%" stop-color="#3b5591"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f4f7fc"/>
      <stop offset="100%" stop-color="#cdd8ee"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0%"   stop-color="#fff8e0" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow">
      <stop offset="0%"   stop-color="#ffd98a" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>

    <!-- The stripe. Rotating the pattern rather than drawing each band is what keeps a cane
         to a single stroked path, so all five are one reusable shape. -->
    <pattern id="stripe" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <rect width="34" height="34" fill="#fdfdfb"/>
      <rect width="17" height="34" fill="#c8102e"/>
    </pattern>

    <!-- One cane, hook at the top, drawn around a 0,0 origin at its foot. -->
    <g id="cane">
      <path d="M0,0 L0,-196 A34,34 0 0 1 68,-196" fill="none" stroke="#a8b6d4"
            stroke-width="30" stroke-linecap="round" opacity=".45" transform="translate(6,4)"/>
      <path d="M0,0 L0,-196 A34,34 0 0 1 68,-196" fill="none" stroke="url(#stripe)"
            stroke-width="28" stroke-linecap="round"/>
      <path d="M0,0 L0,-196 A34,34 0 0 1 68,-196" fill="none" stroke="#00000018"
            stroke-width="28" stroke-linecap="round"/>
    </g>

    <!-- Two snowflake tiles, stacked and shifted by one tile height, so the loop is seamless:
         the group travels exactly 1000px and the second copy lands where the first began. -->
    <g id="flakesA">
      <circle cx="90"   cy="120" r="5"/><circle cx="300"  cy="40"  r="4"/><circle cx="520"  cy="210" r="6"/>
      <circle cx="760"  cy="90"  r="4"/><circle cx="980"  cy="260" r="5"/><circle cx="1180" cy="60"  r="6"/>
      <circle cx="1400" cy="190" r="4"/><circle cx="1520" cy="420" r="5"/><circle cx="160"  cy="470" r="6"/>
      <circle cx="410"  cy="610" r="4"/><circle cx="690"  cy="520" r="5"/><circle cx="900"  cy="700" r="4"/>
      <circle cx="1120" cy="560" r="6"/><circle cx="1330" cy="760" r="5"/><circle cx="240"  cy="830" r="4"/>
      <circle cx="600"  cy="900" r="5"/><circle cx="1000" cy="950" r="4"/><circle cx="1460" cy="880" r="6"/>
    </g>
    <g id="flakesB">
      <circle cx="200"  cy="70"  r="3"/><circle cx="450"  cy="330" r="3"/><circle cx="820"  cy="180" r="3"/>
      <circle cx="1060" cy="420" r="3"/><circle cx="1280" cy="240" r="3"/><circle cx="60"   cy="360" r="3"/>
      <circle cx="540"  cy="740" r="3"/><circle cx="960"  cy="600" r="3"/><circle cx="1420" cy="640" r="3"/>
      <circle cx="330"  cy="960" r="3"/><circle cx="1180" cy="860" r="3"/><circle cx="740"  cy="440" r="3"/>
    </g>
  </defs>

  <!-- Sky, moon, stars -->
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <circle cx="1290" cy="180" r="230" fill="url(#moonGlow)"/>
  <circle cx="1290" cy="180" r="62" fill="#fff8e0"/>
  <circle cx="1264" cy="164" r="12" fill="#efe6c8" opacity=".55"/>
  <circle cx="1308" cy="204" r="8"  fill="#efe6c8" opacity=".45"/>
  <g fill="#ffffff">
    <circle class="star" cx="180"  cy="110" r="3"/>
    <circle class="star" cx="420"  cy="70"  r="2.5" style="animation-delay:-1.1s"/>
    <circle class="star" cx="660"  cy="150" r="3"   style="animation-delay:-2.3s"/>
    <circle class="star" cx="940"  cy="80"  r="2.5" style="animation-delay:-.6s"/>
    <circle class="star" cx="1520" cy="120" r="3"   style="animation-delay:-3.1s"/>
    <circle class="star" cx="80"   cy="260" r="2.5" style="animation-delay:-1.8s"/>
    <circle class="star" cx="1120" cy="230" r="2.5" style="animation-delay:-2.7s"/>
  </g>

  <!-- Treeline: a dark band so the house reads against something, not floating on sky -->
  <g fill="#14224a">
    <path d="M-20,700 L60,540 L140,700 Z"/><path d="M90,700 L180,500 L270,700 Z"/>
    <path d="M230,700 L300,560 L370,700 Z"/><path d="M1240,700 L1320,530 L1400,700 Z"/>
    <path d="M1370,700 L1460,490 L1550,700 Z"/><path d="M1510,700 L1590,560 L1660,700 Z"/>
  </g>
  <g fill="#e8eefb" opacity=".5">
    <path d="M40,596 L60,540 L80,596 Z"/><path d="M156,566 L180,500 L204,566 Z"/>
    <path d="M1296,594 L1320,530 L1344,594 Z"/><path d="M1436,556 L1460,490 L1484,556 Z"/>
  </g>

  <!-- Ground -->
  <path d="M0,700 Q400,660 800,690 T1600,672 L1600,1000 L0,1000 Z" fill="url(#ground)"/>

  <!-- House -->
  <g>
    <!-- glow spilling from the windows onto the snow -->
    <ellipse cx="800" cy="700" rx="360" ry="90" fill="url(#windowGlow)"/>

    <!-- chimney + smoke -->
    <rect x="930" y="300" width="54" height="110" fill="#7a3b34"/>
    <rect x="922" y="290" width="70" height="20" rx="4" fill="#f4f7fc"/>
    <g fill="#ffffff" opacity=".38">
      <circle class="smoke" cx="957" cy="285" r="16"/>
      <circle class="smoke" cx="957" cy="285" r="13" style="animation-delay:-2.4s"/>
      <circle class="smoke" cx="957" cy="285" r="18" style="animation-delay:-4.8s"/>
    </g>

    <!-- roof -->
    <path d="M800,250 L1090,470 L510,470 Z" fill="#8d2f2a"/>
    <path d="M800,250 L1090,470 L1046,470 L800,283 Z" fill="#a03a34"/>
    <!-- snow along the roofline -->
    <path d="M510,470 L1090,470 L1090,448 Q940,430 800,432 Q660,434 510,452 Z" fill="#f4f7fc"/>

    <!-- walls -->
    <rect x="556" y="470" width="488" height="230" fill="#d9c9a8"/>
    <rect x="556" y="470" width="488" height="230" fill="#00000010"/>

    <!-- windows -->
    <g>
      <rect x="608" y="516" width="112" height="96" rx="5" fill="#ffd98a"/>
      <rect x="608" y="516" width="112" height="96" rx="5" fill="none" stroke="#7a5a33" stroke-width="7"/>
      <path d="M664,516 L664,612 M608,564 L720,564" stroke="#7a5a33" stroke-width="6"/>
    </g>
    <g>
      <rect x="880" y="516" width="112" height="96" rx="5" fill="#ffd98a"/>
      <rect x="880" y="516" width="112" height="96" rx="5" fill="none" stroke="#7a5a33" stroke-width="7"/>
      <path d="M936,516 L936,612 M880,564 L992,564" stroke="#7a5a33" stroke-width="6"/>
    </g>

    <!-- door + wreath -->
    <rect x="762" y="546" width="96" height="154" rx="6" fill="#5c4326"/>
    <rect x="762" y="546" width="96" height="154" rx="6" fill="none" stroke="#43301b" stroke-width="6"/>
    <circle cx="810" cy="592" r="26" fill="none" stroke="#2f6b3d" stroke-width="11"/>
    <circle cx="810" cy="618" r="6" fill="#c8102e"/>
    <circle cx="843" cy="628" r="4" fill="#e8c86a"/>

    <!-- string lights along the eaves, staggered so they don't blink in unison -->
    <path d="M512,470 Q800,516 1088,470" fill="none" stroke="#2c3f6e" stroke-width="4"/>
    <g>
      <circle class="twinkle" cx="570"  cy="484" r="8" fill="#ffd166"/>
      <circle class="twinkle" cx="650"  cy="496" r="8" fill="#ef476f" style="animation-delay:-.4s"/>
      <circle class="twinkle" cx="730"  cy="504" r="8" fill="#06d6a0" style="animation-delay:-.8s"/>
      <circle class="twinkle" cx="800"  cy="507" r="8" fill="#ffd166" style="animation-delay:-1.2s"/>
      <circle class="twinkle" cx="870"  cy="504" r="8" fill="#118ab2" style="animation-delay:-1.6s"/>
      <circle class="twinkle" cx="950"  cy="496" r="8" fill="#ef476f" style="animation-delay:-2.0s"/>
      <circle class="twinkle" cx="1030" cy="484" r="8" fill="#06d6a0" style="animation-delay:-2.4s"/>
    </g>

    <!-- shrubs either side of the door -->
    <path d="M552,706 Q552,660 600,660 Q648,660 648,706 Z" fill="#2f6b3d"/>
    <path d="M559,682 Q576,662 600,662 Q624,662 641,682 Q620,672 600,672 Q580,672 559,682 Z" fill="#f4f7fc"/>
    <path d="M1052,706 Q1052,660 1100,660 Q1148,660 1148,706 Z" fill="#2f6b3d"/>
    <path d="M1059,682 Q1076,662 1100,662 Q1124,662 1141,682 Q1120,672 1100,672 Q1080,672 1059,682 Z" fill="#f4f7fc"/>
  </g>

  <!-- The candy canes. Five across the lawn, the middle three inside the centre 60% so they
       survive a cover crop in the narrower cards. -->
  <g>
    <ellipse cx="232" cy="856" rx="34" ry="9"  fill="#9fb0d0" opacity=".45"/>
    <ellipse cx="482" cy="884" rx="39" ry="10" fill="#9fb0d0" opacity=".45"/>
    <ellipse cx="712" cy="920" rx="44" ry="11" fill="#9fb0d0" opacity=".45"/>
    <ellipse cx="962" cy="898" rx="41" ry="10" fill="#9fb0d0" opacity=".45"/>
    <ellipse cx="1342" cy="862" rx="35" ry="9" fill="#9fb0d0" opacity=".45"/>
    <use href="#cane" transform="translate(232,856) scale(.80)"/>
    <use href="#cane" transform="translate(482,884) scale(.93)"/>
    <use href="#cane" transform="translate(712,920) scale(1.06)"/>
    <use href="#cane" transform="translate(962,898) scale(.99)"/>
    <use href="#cane" transform="translate(1342,862) scale(.84)"/>
  </g>

  <!-- Snow, three depths. Each layer holds the tile twice, one shifted a full height up. -->
  <g fill="#ffffff" opacity=".9">
    <g class="snow-layer s1">
      <use href="#flakesA" y="-1000"/><use href="#flakesA"/>
    </g>
  </g>
  <g fill="#ffffff" opacity=".65">
    <g class="snow-layer s2">
      <use href="#flakesB" y="-1000"/><use href="#flakesB"/>
    </g>
  </g>
  <g fill="#ffffff" opacity=".4">
    <g class="snow-layer s3">
      <use href="#flakesA" y="-1000" transform="translate(140,0) scale(1)"/>
      <use href="#flakesA" transform="translate(140,0)"/>
    </g>
  </g>
</svg>
