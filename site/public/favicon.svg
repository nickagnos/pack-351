<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pack 351">
  <!-- Brand colours match --navy and --gold in src/styles.css. Deliberately NOT the BSA
       fleur-de-lis: that emblem is a Scouting America trademark and isn't ours to use as
       a site icon. A plain numeral is safe and reads at 16px. -->
  <rect width="64" height="64" rx="14" fill="#1b3068"/>
  <text x="32" y="33" fill="#d4950a"
        font-family="Verdana, DejaVu Sans, Geneva, sans-serif"
        font-size="26" font-weight="bold" letter-spacing="-1"
        text-anchor="middle" dominant-baseline="central">351</text>
</svg>
